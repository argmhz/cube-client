<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Test</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KyZXEAg3QhqLMpG8r+8fhAXLRk2vvoC2f3B09zVXn8CA5QIVfZOJ3BCsw2P0p/We" crossorigin="anonymous">
    <script type="text/javascript">

      var webSocket = new WebSocket("ws://" + location.host + "/ws");

      function setAttributes(field, data) {
        for(let prop in data) {
          field.setAttribute(prop,data[prop]);
        }
      }

      function setEventListeners(field, data) {
        field.addEventListener('change', (event) => {
          let value = event.target.value;

          if(data.datatype == "integer"){
            value = parseInt(value);
          }

          webSocket.send(JSON.stringify({ action: "set", [field.name] : value }));
        })
      }

      function removeNoneAttributes(data) {
        ['label','options'].forEach((item, i) => {
          delete data[item];
        });
      }



      window.addEventListener('load',function(){

        document.getElementsByTagName("form")[0].addEventListener('input', (event) => {

          let value = event.target.value;

          if(event.target.dataset.datatype == "integer"){
            value = parseInt(value);
          }

          webSocket.send(JSON.stringify({ action: "set", [event.target.name] : value }));

        });

        webSocket.addEventListener('open', function(e){

          webSocket.send(JSON.stringify({
            action: "options"
          }));
        });

        webSocket.addEventListener('message',(event) => {

          if (event.data instanceof Blob) {
            event.data.text().then((result) => {
              var data = JSON.parse(result);
              switch (data.action) {
                case "options":
                  var select = document.getElementById("options");
                  data.animations.forEach(function(file){
                    var option = document.createElement('option');
                    option.value = file;
                    option.innerHTML = file.replace('./bin/animations/','').replace('.so','');
                    select.append(option)
                  });
                  break;
                default:

              }

            });
          }
        });

        document.getElementById('options').addEventListener('change', function(event){

          webSocket.send(JSON.stringify({
            action:"select",
            animation: event.target.value
          }));

          let form = document.getElementById("form");
          form.innerHTML = "";
          fetch('/data/' + event.target.value.replace('./bin/animations/','').replace('.so','') + '.json').then( (response) => {

            if(response.status != 200){
              form.innerHTML = "";
              return;
            }

            response.json().then((data) => {
              for (let name in data.fields) {
                let field = undefined;

                switch (data.fields[name].type) {
                  case 'select':
                    field = document.createElement('select');
                    delete data.fields[name].type;
                    if(data.fields[name].options) {
                      data.fields[name].options.forEach((item, i) => {
                        let opt = document.createElement('option');
                        opt.setAttribute('value' , item.value);
                        opt.innerHTML = item.label;
                        field.appendChild(opt);
                      });
                    }
                  break;
                  case 'button':
                    field = document.createElement('button');
                    field.innerHTML = data.fields[name].value;
                    field.addEventListener('click',function(){
                      webSocket.send(JSON.stringify({ action: "set", [data.fields[name].name] : data.fields[name].send }));
                    });

                  break;
                  default:
                    field = document.createElement('input');

                }

                field.classList.add('form-control');
                field.setAttribute('id', name);
                field.dataset.datatype = data.fields[name].datatype;

                let wrap = document.createElement('div');
                wrap.classList.add('mb-3');

                if(data.fields[name].label) {
                  let label = document.createElement('label');
                  label.setAttribute('for', name);
                  label.classList.add('form-label');
                  label.innerHTML = data.fields[name].label;
                  delete data.fields[name].label;
                  wrap.appendChild(label);
                }

                removeNoneAttributes(data.fields[name]);
                setAttributes(field, data.fields[name]);

                wrap.appendChild(field);
                form.appendChild(wrap);
              }
            }).catch((err) => console.dir(err));

          });

        });
      });
    </script>

  </head>
  <body class="bg-dark text-light">
    <div class="container">

      <div class="row">
        <div class="col-12">
          <select class="form-select form-select-lg my-3" id="options">
            <option>Vælg animation</option>
          </select>
        </div>
        <div class="col-12">
          <form>
            <div id="form"></div>
          </form>
        </div>
      </div>
    </div>

    <!-- JavaScript Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-U1DAWAznBHeqEIlVSCgzq+c9gqGAJn5c/t99JyeKa9xxaYpSvHU5awsuZVVFIhvj" crossorigin="anonymous"></script>
  </body>
</html>

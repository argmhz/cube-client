<!DOCTYPE html>
<html lang="da" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Cube</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap">
    <style>
      :root {
        --bg: #0b0710;
        --surface: #150f1e;
        --surface-raised: #1b1327;
        --border: #2a2138;
        --text: #f1edf7;
        --text-dim: #a89cbf;
        --text-faint: #6d6081;
        --accent-a: #ff5ec4;
        --accent-b: #7c5cff;
        --accent-c: #35d0ff;
        --focus: #7c5cff;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: "Manrope", system-ui, sans-serif;
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        display: flex;
        justify-content: center;
        padding: 32px 16px;
      }

      .panel {
        width: 100%;
        max-width: 560px;
      }

      header {
        text-align: center;
        margin-bottom: 28px;
      }

      header h1 {
        font-family: "Sora", system-ui, sans-serif;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -0.01em;
        margin: 0 0 6px;
        text-wrap: balance;
        background: linear-gradient(90deg, var(--accent-a), var(--accent-b), var(--accent-c));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      header p {
        margin: 0;
        color: var(--text-dim);
        font-size: 14.5px;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
      }

      .field-label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-dim);
        margin-bottom: 8px;
      }

      select,
      input:not([type="range"]) {
        width: 100%;
        appearance: none;
        background: var(--surface-raised);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        font-family: inherit;
        font-size: 15px;
        padding: 12px 14px;
      }

      select {
        background-image: linear-gradient(45deg, transparent 50%, var(--text-dim) 50%), linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
        background-position: calc(100% - 20px) center, calc(100% - 15px) center;
        background-size: 5px 5px, 5px 5px;
        background-repeat: no-repeat;
      }

      select:focus,
      input:focus,
      button:focus-visible {
        outline: none;
        border-color: var(--focus);
        box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.35);
      }

      #options {
        font-size: 17px;
        font-weight: 600;
        padding: 14px 16px;
        margin-bottom: 20px;
      }

      #form:empty {
        display: none;
      }

      #form .mb-3 {
        margin-bottom: 18px;
      }

      #form .mb-3:last-child {
        margin-bottom: 0;
      }

      .form-label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-dim);
        margin-bottom: 8px;
      }

      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 6px;
        border-radius: 100px;
        background: var(--surface-raised);
        border: 1px solid var(--border);
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent-b), var(--accent-c));
        cursor: pointer;
        border: 2px solid var(--bg);
      }

      input[type="range"]::-moz-range-thumb {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 2px solid var(--bg);
        background: linear-gradient(135deg, var(--accent-b), var(--accent-c));
        cursor: pointer;
      }

      button.form-control {
        width: 100%;
        background: linear-gradient(90deg, var(--accent-a), var(--accent-b));
        border: none;
        border-radius: 10px;
        color: #0b0710;
        font-family: inherit;
        font-size: 15px;
        font-weight: 700;
        padding: 12px 14px;
        cursor: pointer;
      }

      button.form-control:hover {
        filter: brightness(1.08);
      }

      footer {
        text-align: center;
        margin-top: 24px;
        color: var(--text-faint);
        font-size: 12.5px;
      }
    </style>
    <script type="text/javascript">

      var webSocket = new WebSocket("ws://" + location.host + "/ws");

      function setAttributes(field, data) {
        for(let prop in data) {
          field.setAttribute(prop,data[prop]);
        }
      }

      function setEventListeners(field, data) {
        field.addEventListener('change', (event) => {
          let value = event.target.value;

          if(data.datatype == "integer"){
            value = parseInt(value);
          }

          webSocket.send(JSON.stringify({ action: "set", [field.name] : value }));
        })
      }

      function removeNoneAttributes(data) {
        ['label','options'].forEach((item, i) => {
          delete data[item];
        });
      }



      window.addEventListener('load',function(){

        document.getElementsByTagName("form")[0].addEventListener('input', (event) => {

          let value = event.target.value;

          if(event.target.dataset.datatype == "integer"){
            value = parseInt(value);
          }

          webSocket.send(JSON.stringify({ action: "set", [event.target.name] : value }));

        });

        webSocket.addEventListener('open', function(e){

          webSocket.send(JSON.stringify({
            action: "options"
          }));
        });

        webSocket.addEventListener('message',(event) => {

          if (event.data instanceof Blob) {
            event.data.text().then((result) => {
              var data = JSON.parse(result);
              switch (data.action) {
                case "options":
                  var select = document.getElementById("options");
                  data.animations.forEach(function(file){
                    var option = document.createElement('option');
                    option.value = file;
                    option.innerHTML = file.replace('./bin/animations/','').replace('.so','');
                    select.append(option)
                  });
                  break;
                default:

              }

            });
          }
        });

        document.getElementById('options').addEventListener('change', function(event){

          webSocket.send(JSON.stringify({
            action:"select",
            animation: event.target.value
          }));

          let form = document.getElementById("form");
          form.innerHTML = "";
          fetch('/data/' + event.target.value.replace('./bin/animations/','').replace('.so','') + '.json').then( (response) => {

            if(response.status != 200){
              form.innerHTML = "";
              return;
            }

            response.json().then((data) => {
              for (let name in data.fields) {
                let field = undefined;

                switch (data.fields[name].type) {
                  case 'select':
                    field = document.createElement('select');
                    delete data.fields[name].type;
                    if(data.fields[name].options) {
                      data.fields[name].options.forEach((item, i) => {
                        let opt = document.createElement('option');
                        opt.setAttribute('value' , item.value);
                        opt.innerHTML = item.label;
                        field.appendChild(opt);
                      });
                    }
                  break;
                  case 'button':
                    field = document.createElement('button');
                    field.innerHTML = data.fields[name].value;
                    field.addEventListener('click',function(){
                      webSocket.send(JSON.stringify({ action: "set", [data.fields[name].name] : data.fields[name].send }));
                    });

                  break;
                  default:
                    field = document.createElement('input');

                }

                field.classList.add('form-control');
                field.setAttribute('id', name);
                field.dataset.datatype = data.fields[name].datatype;

                let wrap = document.createElement('div');
                wrap.classList.add('mb-3');

                if(data.fields[name].label) {
                  let label = document.createElement('label');
                  label.setAttribute('for', name);
                  label.classList.add('form-label');
                  label.innerHTML = data.fields[name].label;
                  delete data.fields[name].label;
                  wrap.appendChild(label);
                }

                removeNoneAttributes(data.fields[name]);
                setAttributes(field, data.fields[name]);

                wrap.appendChild(field);
                form.appendChild(wrap);
              }
            }).catch((err) => console.dir(err));

          });

        });
      });
    </script>

  </head>
  <body>
    <div class="panel">
      <header>
        <h1>Cube</h1>
        <p>Fjernbetjening til den fysiske LED-kube</p>
      </header>

      <div class="card">
        <label class="field-label" for="options">Animation</label>
        <select id="options">
          <option>Vælg animation</option>
        </select>

        <form>
          <div id="form"></div>
        </form>
      </div>

      <footer>Forbundet via WebSocket til cube-serveren</footer>
    </div>
  </body>
</html>

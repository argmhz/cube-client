<!DOCTYPE html>
<html lang="da" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Cube</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#150f1e">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icon.svg">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap">
    <style>
      :root {
        --bg: #0b0710;
        --surface: #150f1e;
        --surface-raised: #1b1327;
        --border: #2a2138;
        --text: #f1edf7;
        --text-dim: #a89cbf;
        --text-faint: #6d6081;
        --accent-a: #ff5ec4;
        --accent-b: #7c5cff;
        --accent-c: #35d0ff;
        --focus: #7c5cff;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: "Manrope", system-ui, sans-serif;
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 32px 16px;
      }

      .status-banner {
        display: none;
        width: 100%;
        max-width: 560px;
        box-sizing: border-box;
        text-align: center;
        font-size: 13.5px;
        font-weight: 600;
        border-radius: 10px;
        padding: 10px 16px;
        margin-bottom: 16px;
      }

      .status-banner.visible {
        display: block;
      }

      .status-banner.reconnecting {
        background: #3a1420;
        color: #ff9db8;
      }

      .status-banner.waiting-for-cube {
        background: #3a2e12;
        color: #ffd580;
      }

      .panel {
        width: 100%;
        max-width: 560px;
      }

      header {
        text-align: center;
        margin-bottom: 28px;
      }

      header h1 {
        font-family: "Sora", system-ui, sans-serif;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -0.01em;
        margin: 0 0 6px;
        text-wrap: balance;
        background: linear-gradient(90deg, var(--accent-a), var(--accent-b), var(--accent-c));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      header p {
        margin: 0;
        color: var(--text-dim);
        font-size: 14.5px;
      }

      .now-playing {
        text-align: center;
        color: var(--text-dim);
        font-size: 13.5px;
        margin: 0 0 20px;
      }

      .now-playing strong {
        color: var(--text);
        font-weight: 700;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
      }

      .field-label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-dim);
        margin-bottom: 8px;
      }

      select,
      input:not([type="range"]) {
        width: 100%;
        appearance: none;
        background: var(--surface-raised);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        font-family: inherit;
        font-size: 15px;
        padding: 12px 14px;
      }

      select {
        background-image: linear-gradient(45deg, transparent 50%, var(--text-dim) 50%), linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
        background-position: calc(100% - 20px) center, calc(100% - 15px) center;
        background-size: 5px 5px, 5px 5px;
        background-repeat: no-repeat;
      }

      select:focus,
      input:focus,
      button:focus-visible {
        outline: none;
        border-color: var(--focus);
        box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.35);
      }

      #options {
        font-size: 17px;
        font-weight: 600;
        padding: 14px 16px;
        margin-bottom: 20px;
      }

      #form:empty {
        display: none;
      }

      #form {
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
      }

      #form .mb-3 {
        flex: 1 1 100%;
      }

      /* Direction-style button groups (e.g. Dot's +X/-X/+Y/-Y/+Z/-Z) sit two
         to a row instead of stacking one per row like every other field. */
      #form .mb-3.btn-grid-item {
        flex: 1 1 calc(50% - 9px);
      }

      .form-label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-dim);
        margin-bottom: 8px;
      }

      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 6px;
        border-radius: 100px;
        background: var(--surface-raised);
        border: 1px solid var(--border);
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent-b), var(--accent-c));
        cursor: pointer;
        border: 2px solid var(--bg);
      }

      input[type="range"]::-moz-range-thumb {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 2px solid var(--bg);
        background: linear-gradient(135deg, var(--accent-b), var(--accent-c));
        cursor: pointer;
      }

      button.form-control {
        width: 100%;
        background: linear-gradient(90deg, var(--accent-a), var(--accent-b));
        border: none;
        border-radius: 10px;
        color: #0b0710;
        font-family: inherit;
        font-size: 15px;
        font-weight: 700;
        padding: 12px 14px;
        cursor: pointer;
      }

      button.form-control:hover {
        filter: brightness(1.08);
      }

      .mic-card {
        margin-top: 20px;
      }

      .mic-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .mic-head .field-label {
        margin-bottom: 0;
      }

      .mic-toggle {
        background: linear-gradient(90deg, var(--accent-a), var(--accent-b));
        border: none;
        border-radius: 10px;
        color: #0b0710;
        font-family: inherit;
        font-size: 14px;
        font-weight: 700;
        padding: 9px 18px;
        cursor: pointer;
      }

      .mic-toggle:hover { filter: brightness(1.08); }

      .mic-toggle.is-on {
        background: var(--surface-raised);
        border: 1px solid var(--border);
        color: var(--text);
      }

      /* The meters stand upright in the same order the cube's rings run,
         bass on the left through treble on the right, so the panel reads
         like a slice through the cube itself. */
      .mic-meter {
        display: flex;
        gap: 10px;
      }

      .mic-band {
        flex: 1;
        text-align: center;
      }

      .mic-bar {
        height: 60px;
        border-radius: 8px;
        background: var(--surface-raised);
        border: 1px solid var(--border);
        display: flex;
        align-items: flex-end;
        overflow: hidden;
      }

      .mic-fill {
        width: 100%;
        height: 0;
        transition: height 80ms linear;
      }

      .mic-band:nth-child(1) .mic-fill { background: #ff3b30; }
      .mic-band:nth-child(2) .mic-fill { background: #ff9f0a; }
      .mic-band:nth-child(3) .mic-fill { background: #30d158; }
      .mic-band:nth-child(4) .mic-fill { background: var(--accent-c); }

      .mic-band small {
        display: block;
        margin-top: 7px;
        font-size: 11.5px;
        color: var(--text-faint);
      }

      .mic-status {
        margin-top: 14px;
        font-size: 12.5px;
        color: var(--text-dim);
      }

      footer {
        text-align: center;
        margin-top: 24px;
        color: var(--text-faint);
        font-size: 12.5px;
      }
    </style>
    <script type="text/javascript">

      var webSocket;

      // Every command is newline-terminated. The cube server splits its TCP
      // stream on '\n' (lib/net/ConnectionLoop.h); without the terminator a
      // slider move sent while the mic is streaming gets glued to the next
      // band update and both are dropped. Sends are skipped while the socket
      // is down rather than throwing -- the mic pushes 30 a second, and
      // index.js reconnects on its own.
      function send(command) {
        if (!webSocket || webSocket.readyState !== WebSocket.OPEN) {
          return;
        }
        webSocket.send(JSON.stringify(command) + "\n");
      }

      // WebSocket messages carrying cube-server data arrive as a Blob (the
      // existing binary passthrough from index.js); our own synthetic
      // connectionStatus messages arrive as a plain text frame. Normalize
      // both to a string before JSON.parse.
      function messageText(data) {
        if (data instanceof Blob) {
          return data.text();
        }
        return Promise.resolve(data);
      }

      function setConnectionBanner(state) {
        var banner = document.getElementById('connectionBanner');
        if (state === 'ok') {
          banner.className = 'status-banner';
          return;
        }
        banner.className = 'status-banner visible ' + state;
        banner.textContent = state === 'reconnecting'
          ? 'Forbinder til cube-client...'
          : 'Forbundet, men venter på kuben...';
      }

      function setNowPlaying(name) {
        var el = document.getElementById('nowPlaying');
        el.innerHTML = name
          ? 'Kører: <strong>' + name + '</strong>'
          : 'Ingen animation valgt endnu';
      }

      function connectWebSocket() {
        webSocket = new WebSocket("ws://" + location.host + "/ws");

        webSocket.addEventListener('open', function(e){
          send({ action: "options" });
        });

        webSocket.addEventListener('close', function(e){
          setConnectionBanner('reconnecting');
          setTimeout(connectWebSocket, 2000);
        });

        webSocket.addEventListener('message',(event) => {
          messageText(event.data).then((result) => {
            var data = JSON.parse(result);
            switch (data.action) {
              case "options":
                var select = document.getElementById("options");
                data.animations.forEach(function(file){
                  var option = document.createElement('option');
                  option.value = file;
                  option.innerHTML = file.replace('./bin/animations/','').replace('.so','');
                  select.append(option)
                });
                break;
              case "connectionStatus":
                setConnectionBanner(data.connected ? 'ok' : 'waiting-for-cube');
                break;
              case "nowPlaying":
                setNowPlaying(data.animation);
                break;
              default:

            }
          });
        });
      }

      function setAttributes(field, data) {
        for(let prop in data) {
          field.setAttribute(prop,data[prop]);
        }
      }

      function setEventListeners(field, data) {
        field.addEventListener('change', (event) => {
          let value = event.target.value;

          if(data.datatype == "integer"){
            value = parseInt(value);
          }

          send({ action: "set", [field.name] : value });
        })
      }

      // ---- microphone capture --------------------------------------------
      // All the analysis happens here in the browser: an AnalyserNode's FFT
      // is collapsed into four averages -- bass, low-mid, high-mid, treble,
      // one per ring of the cube -- and streamed as
      // {"action":"set","bands":[0-255 x4]} about 30 times a second.
      // animations/Spectrum.cpp only draws what it is handed; nothing is
      // analysed on the Pi.

      var BAND_EDGES = [[20, 250], [250, 1000], [1000, 4000], [4000, 12000]];
      // Ordinary music puts far more energy in the bass than the treble, so
      // the upper bands are nudged to make all four rings usable at one
      // sensitivity setting.
      var BAND_WEIGHTS = [1.0, 1.1, 1.4, 1.8];
      var SEND_INTERVAL_MS = 33;

      var micStream = null;
      var micContext = null;
      var micTimer = null;

      function setMicStatus(text) {
        document.getElementById('micStatus').textContent = text;
      }

      function showMicLevels(bands) {
        var fills = document.querySelectorAll('#micMeter .mic-fill');
        bands.forEach(function(value, i) {
          fills[i].style.height = Math.round(value / 255 * 100) + '%';
        });
      }

      function readBands(analyser, freqData) {
        analyser.getByteFrequencyData(freqData);
        var binHz = micContext.sampleRate / analyser.fftSize;

        return BAND_EDGES.map(function(edge, i) {
          var from = Math.max(0, Math.floor(edge[0] / binHz));
          var to = Math.min(freqData.length - 1, Math.ceil(edge[1] / binHz));
          var sum = 0;
          for (var bin = from; bin <= to; bin++) {
            sum += freqData[bin];
          }
          var average = sum / Math.max(1, to - from + 1);
          return Math.max(0, Math.min(255, Math.round(average * BAND_WEIGHTS[i])));
        });
      }

      function startMic() {
        // getUserMedia only exists in a secure context. Opening this page on
        // the Pi's LAN address over plain http leaves mediaDevices undefined
        // -- worth saying so, since the browser gives no visible reason.
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setMicStatus('Mikrofon kræver https eller localhost — ' + location.origin + ' er ikke en sikker kontekst.');
          return;
        }

        navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
        }).then(function(stream) {
          micStream = stream;
          micContext = new (window.AudioContext || window.webkitAudioContext)();

          var analyser = micContext.createAnalyser();
          analyser.fftSize = 2048;
          analyser.smoothingTimeConstant = 0.6;
          micContext.createMediaStreamSource(stream).connect(analyser);

          var freqData = new Uint8Array(analyser.frequencyBinCount);
          micTimer = setInterval(function() {
            var bands = readBands(analyser, freqData);
            send({ action: 'set', bands: bands });
            showMicLevels(bands);
          }, SEND_INTERVAL_MS);

          var micBtn = document.getElementById('micBtn');
          micBtn.textContent = 'Slå fra';
          micBtn.classList.add('is-on');
          setMicStatus('Lytter — ' + Math.round(micContext.sampleRate / 1000) + ' kHz, sender ' + Math.round(1000 / SEND_INTERVAL_MS) + ' gange i sekundet.');
        }).catch(function(err) {
          setMicStatus('Mikrofonen blev afvist: ' + err.name);
        });
      }

      function stopMic() {
        if (micTimer) {
          clearInterval(micTimer);
          micTimer = null;
        }
        if (micStream) {
          micStream.getTracks().forEach(function(track) { track.stop(); });
          micStream = null;
        }
        if (micContext) {
          micContext.close();
          micContext = null;
        }

        // Leave the cube dark rather than frozen on the last frame.
        send({ action: 'set', bands: [0, 0, 0, 0] });
        showMicLevels([0, 0, 0, 0]);
        var micBtn = document.getElementById('micBtn');
        micBtn.textContent = 'Slå til';
        micBtn.classList.remove('is-on');
        setMicStatus('Slået fra.');
      }

      function setMicVisible(visible) {
        document.getElementById('micCard').hidden = !visible;
        if (!visible && micTimer) {
          stopMic();
        }
      }

      function removeNoneAttributes(data) {
        ['label','options'].forEach((item, i) => {
          delete data[item];
        });
      }



      window.addEventListener('load',function(){

        document.getElementsByTagName("form")[0].addEventListener('input', (event) => {

          let value = event.target.value;

          if(event.target.dataset.datatype == "integer"){
            value = parseInt(value);
          } else if(event.target.dataset.datatype == "float"){
            value = parseFloat(value);
          }

          send({ action: "set", [event.target.name] : value });

        });

        document.getElementById('micBtn').addEventListener('click', function() {
          if (micTimer) {
            stopMic();
          } else {
            startMic();
          }
        });

        connectWebSocket();

        document.getElementById('options').addEventListener('change', function(event){

          send({ action:"select", animation: event.target.value });

          let form = document.getElementById("form");
          form.innerHTML = "";
          fetch('/data/' + event.target.value.replace('./bin/animations/','').replace('.so','') + '.json').then( (response) => {

            if(response.status != 200){
              form.innerHTML = "";
              setMicVisible(false);
              return;
            }

            response.json().then((data) => {
              setMicVisible(!!data.mic);
              for (let name in data.fields) {
                let field = undefined;

                switch (data.fields[name].type) {
                  case 'select':
                    field = document.createElement('select');
                    delete data.fields[name].type;
                    if(data.fields[name].options) {
                      data.fields[name].options.forEach((item, i) => {
                        let opt = document.createElement('option');
                        opt.setAttribute('value' , item.value);
                        opt.innerHTML = item.label;
                        field.appendChild(opt);
                      });
                    }
                  break;
                  case 'button':
                    field = document.createElement('button');
                    field.innerHTML = data.fields[name].value;
                    field.addEventListener('click',function(){
                      send({ action: "set", [data.fields[name].name] : data.fields[name].send });
                    });

                  break;
                  default:
                    field = document.createElement('input');

                }

                field.classList.add('form-control');
                field.setAttribute('id', name);
                field.dataset.datatype = data.fields[name].datatype;

                let wrap = document.createElement('div');
                wrap.classList.add('mb-3');
                if(data.fields[name].type === 'button') {
                  wrap.classList.add('btn-grid-item');
                }

                if(data.fields[name].label) {
                  let label = document.createElement('label');
                  label.setAttribute('for', name);
                  label.classList.add('form-label');
                  label.innerHTML = data.fields[name].label;
                  delete data.fields[name].label;
                  wrap.appendChild(label);
                }

                removeNoneAttributes(data.fields[name]);
                setAttributes(field, data.fields[name]);

                wrap.appendChild(field);
                form.appendChild(wrap);
              }
            }).catch((err) => console.dir(err));

          });

        });
      });
    </script>

  </head>
  <body>
    <div id="connectionBanner" class="status-banner visible reconnecting">Forbinder til cube-client...</div>
    <div class="panel">
      <header>
        <h1>Cube</h1>
        <p>Fjernbetjening til den fysiske LED-kube</p>
      </header>

      <p id="nowPlaying" class="now-playing">Ingen animation valgt endnu</p>

      <div class="card">
        <label class="field-label" for="options">Animation</label>
        <select id="options">
          <option>Vælg animation</option>
        </select>

        <form>
          <div id="form"></div>
        </form>
      </div>

      <div class="card mic-card" id="micCard" hidden>
        <div class="mic-head">
          <span class="field-label">Mikrofon</span>
          <button type="button" class="mic-toggle" id="micBtn">Slå til</button>
        </div>
        <div class="mic-meter" id="micMeter">
          <div class="mic-band"><div class="mic-bar"><div class="mic-fill"></div></div><small>Bas</small></div>
          <div class="mic-band"><div class="mic-bar"><div class="mic-fill"></div></div><small>Lav-mid</small></div>
          <div class="mic-band"><div class="mic-bar"><div class="mic-fill"></div></div><small>Høj-mid</small></div>
          <div class="mic-band"><div class="mic-bar"><div class="mic-fill"></div></div><small>Diskant</small></div>
        </div>
        <p class="mic-status" id="micStatus">Slået fra.</p>
      </div>

      <footer>Forbundet via WebSocket til cube-serveren</footer>
    </div>
  </body>
</html>
